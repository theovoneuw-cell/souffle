<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D0C">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Souffle">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Souffle</title>
<style>
:root{
  --bg:#0B0D0C; --surface:#141816; --surface2:#1C211E; --line:#262C28;
  --text:#F2F1EC; --muted:#8C928D; --air:#7CF2C4; --ember:#FF6A3D; --gold:#F2C14E;
  --r:22px; --tabh:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;overscroll-behavior-y:none}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--air)}
.wrap{max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 18px calc(var(--tabh) + var(--safe-b) + 110px)}
.eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow.air{color:var(--air)} .eyebrow.ember{color:var(--ember)} .eyebrow.gold{color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:12px}
.muted{color:var(--muted)} .small{font-size:13.5px} .air{color:var(--air)} .ember{color:var(--ember)} .gold{color:var(--gold)}
h1{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-size:36px;line-height:1.08;margin:6px 0 8px;letter-spacing:-.02em}
h2{font-size:18px;margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.grid .card{margin:0;padding:15px}
.stat{font-size:25px;font-weight:650;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--air);transition:width .6s ease}
.btn{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px;border-radius:18px;font-weight:650;font-size:17px;background:var(--air);color:var(--bg);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ember{background:var(--ember);box-shadow:0 8px 28px rgba(255,106,61,.35)}
.btn.ghost{background:var(--surface2);color:var(--text);font-weight:550}
.btn.gold{background:var(--gold)}
.row{display:flex;align-items:center;gap:14px}
.spacer{flex:1}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,13,12,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--air)}
.sosdock{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--safe-b) + 12px);z-index:15;pointer-events:none}
.sosdock .in{max-width:520px;margin:0 auto;padding:0 18px;pointer-events:auto}

/* Hero */
.hero{padding:16px 0 8px}
.days{font-size:104px;font-weight:750;line-height:.95;letter-spacing:-.04em}
.days small{font-size:26px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:10px}
.clock{font-size:21px;font-weight:550;color:var(--air);margin-top:8px}
.quote{font-family:"New York",ui-serif,Georgia,serif;font-size:22px;font-weight:600;line-height:1.3;margin-top:8px}

/* Ring */
.ring{width:62px;height:62px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}

/* Timeline */
.tl{position:relative;margin-top:10px}
.ms{display:flex;gap:16px;position:relative;padding-bottom:26px}
.ms:not(:last-child)::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--line)}
.ms.done:not(:last-child)::before{background:rgba(124,242,196,.5)}
.dot{width:36px;height:36px;flex:none;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-size:16px;position:relative}
.ms.done .dot{background:var(--air);border-color:var(--air);color:var(--bg);font-weight:800}
.ms.cur .dot{border-color:var(--air)}
.ms .t{color:var(--muted);font-weight:600}
.ms.done .t,.ms.cur .t{color:var(--text)}

/* Health */
.badge{font-size:13px;font-weight:650;padding:4px 10px;border-radius:99px}
.vals{display:flex;align-items:baseline;gap:18px;margin:12px 0 6px}
.val{font-size:26px;font-weight:650}
.spark{width:100%;height:84px;display:block;margin:6px 0 4px}
.steps-guide{margin:0;padding-left:20px}
.steps-guide li{margin:10px 0}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px 6px;word-break:break-all}
.code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;word-break:break-all;margin-top:8px;user-select:all;-webkit-user-select:all}

/* Forms */
label.f{display:block;margin-top:16px}
label.f .eyebrow{display:block;margin-bottom:8px}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;outline:none;font-size:17px}
.inp:focus{border-color:var(--air)}
textarea.inp{resize:none;min-height:54px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 16px}
.stepper b{font-size:22px}
.stepper .pm{display:flex;gap:6px}
.stepper button{width:44px;height:40px;border-radius:11px;background:var(--surface2);font-size:22px;font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:18px}
.seg button{padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text)}
.progress{display:flex;gap:6px;margin-bottom:6px}
.progress i{flex:1;height:4px;border-radius:9px;background:var(--line);transition:background .3s}
.progress i.on{background:var(--air)}
.list .li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.x{width:32px;height:32px;border-radius:50%;background:var(--surface2);color:var(--muted);flex:none}

/* Onboarding */
.onb{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 14px) 22px calc(var(--safe-b) + 18px)}
.onb .body{flex:1;padding-top:18px;animation:in .35s ease}
.onb .foot{display:flex;gap:10px;padding-top:18px}
.onb .foot .back{width:64px;flex:none}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

/* SOS */
.sos{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 42%,rgba(124,242,196,.10),transparent 60%),var(--bg);display:flex;flex-direction:column;padding:calc(var(--safe-t) + 12px) 20px calc(var(--safe-b) + 16px);animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sos .top{display:flex;align-items:center;justify-content:space-between}
.sos .close{width:44px;height:44px;border-radius:50%;background:var(--surface2);font-size:18px}
.breath{flex:1;display:grid;place-items:center;position:relative}
.breath .o{position:absolute;width:min(78vw,300px);aspect-ratio:1;border-radius:50%}
.breath .guide{border:1px solid var(--line)}
.breath .fill{background:rgba(124,242,196,.14);border:2px solid var(--air);transform:scale(.45);transition:transform 4s ease-in-out}
.breath .lbl{position:relative;text-align:center}
.breath .lbl b{display:block;font-size:27px;font-family:ui-rounded,system-ui;font-weight:650}
.enc{font-family:"New York",ui-serif,Georgia,serif;font-size:19px;text-align:center;min-height:78px;display:grid;place-items:center;padding:0 10px;transition:opacity .4s}
.link{display:block;margin:12px auto 0;color:var(--muted);font-size:14px;padding:6px}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translateX(-50%);z-index:60;background:var(--surface2);border:1px solid var(--line);padding:12px 18px;border-radius:99px;font-weight:600;font-size:14.5px;animation:fade .3s ease;white-space:nowrap}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Souffle a besoin de JavaScript.</noscript>

<script>
"use strict";

/* ============================================================
   Données : tout reste dans ce navigateur (localStorage).
   ============================================================ */
const KEY = "souffle.v1";
const MIN = 60e3, HOUR = 36e5, DAY = 864e5;
const MIN_PER_CIG = 20; // estimation UCL 2024 (~20 min de vie par cigarette)

function blank(){ return {profile:null, cravings:[], health:{entries:{}, baseline:null}, ui:{tab:"today"}}; }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && typeof s==="object"){ const b=blank(); return {...b, ...s, health:{...b.health, ...(s.health||{})}, ui:{...b.ui, ...(s.ui||{})}}; }
  }catch(e){}
  return blank();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ============================================================
   Étapes de récupération (repères OMS / Tabac Info Service)
   ============================================================ */
const MILESTONES = [
  [20*MIN,"20 min","Ton cœur ralentit","La tension et le pouls redescendent vers la normale.","♥"],
  [8*HOUR,"8 h","L'oxygène revient","Le monoxyde de carbone dans ton sang a diminué de moitié, l'oxygène se normalise.","○"],
  [24*HOUR,"24 h","CO éliminé","Le monoxyde de carbone a quitté ton corps. Tes poumons commencent à se nettoyer.","≈"],
  [48*HOUR,"48 h","Goût et odorat","Plus de nicotine dans le sang. Le goût et l'odorat se réveillent.","✦"],
  [72*HOUR,"72 h","Tu respires mieux","Les bronches se relâchent, respirer demande moins d'effort. C'est souvent le pic du manque : tiens bon.","☁"],
  [14*DAY,"2 sem.","Circulation","La circulation s'améliore, marcher et monter les escaliers devient plus facile.","↗"],
  [30*DAY,"1 mois","Moins de toux","La toux et la fatigue reculent, les cils bronchiques repoussent.","✧"],
  [90*DAY,"3 mois","Capacité pulmonaire","Ta fonction respiratoire peut avoir progressé jusqu'à 30 %.","◎"],
  [365*DAY,"1 an","Cœur protégé","Le risque d'infarctus est divisé par deux.","♡"],
  [5*365*DAY,"5 ans","Cerveau protégé","Le risque d'AVC se rapproche de celui d'un non-fumeur.","◇"],
  [10*365*DAY,"10 ans","Poumons","Le risque de cancer du poumon est divisé par deux.","❖"],
  [15*365*DAY,"15 ans","Comme un non-fumeur","Ton risque cardiovasculaire rejoint celui d'une personne qui n'a jamais fumé.","★"],
].map(([after,label,title,detail,ic],id)=>({id,after,label,title,detail,ic}));
const nextMilestone = el => MILESTONES.find(m=>m.after>el);
const reached = el => MILESTONES.filter(m=>m.after<=el).length;

/* ============================================================
   Mesures santé (envoyées par le Raccourci iPhone)
   ============================================================ */
const METRICS = [
  {k:"rhr", title:"Pouls au repos", unit:"bpm", dec:0, lower:true, ic:"♥",
   why:"La nicotine accélère le cœur. Sans elle, ton pouls au repos baisse."},
  {k:"hrv", title:"Variabilité cardiaque", unit:"ms", dec:0, lower:false, ic:"∿",
   why:"Une variabilité plus haute = un système nerveux moins stressé. Elle remonte après l'arrêt."},
  {k:"o2", title:"Oxygène sanguin", unit:"%", dec:1, lower:false, ic:"○",
   why:"Le monoxyde de carbone prend la place de l'oxygène. Il s'en va, l'oxygène revient."},
  {k:"rr", title:"Fréquence respiratoire", unit:"resp/min", dec:1, lower:true, ic:"≈",
   why:"Des bronches qui se dégagent, c'est une respiration plus calme."},
  {k:"steps", title:"Pas par jour", unit:"pas", dec:0, lower:false, ic:"↗",
   why:"Plus de souffle, plus d'envie de bouger. Et bouger aide contre les envies."},
];

function parseNum(v){
  if(v==null) return null;
  const m = String(v).replace(/\s| | /g,"").match(/-?\d+(?:[.,]\d+)?/);
  if(!m) return null;
  const n = parseFloat(m[0].replace(",","."));
  return isFinite(n) ? n : null;
}
function todayKey(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/** Lit les valeurs dans l'URL (#rhr=58&hrv=42&o2=97&rr=14&pas7=59000). Le # ne quitte jamais le téléphone. */
function importFromHash(){
  const h = location.hash.replace(/^#/,"");
  if(!h || !/(^|&)(rhr|hrv|o2|rr|pas7|pas)=/.test(h)) return false;
  const p = new URLSearchParams(h);
  const e = {};
  const rhr=parseNum(p.get("rhr")), hrv=parseNum(p.get("hrv")), rr=parseNum(p.get("rr"));
  let o2=parseNum(p.get("o2"));
  if(o2!=null && o2<=1.5) o2*=100;
  let steps=null;
  if(p.has("pas7")){ const v=parseNum(p.get("pas7")); if(v!=null) steps=v/7; }
  else if(p.has("pas")) steps=parseNum(p.get("pas"));
  if(rhr!=null && rhr>25 && rhr<200) e.rhr=rhr;
  if(hrv!=null && hrv>0 && hrv<400) e.hrv=hrv;
  if(o2!=null && o2>50 && o2<=100) e.o2=o2;
  if(rr!=null && rr>4 && rr<60) e.rr=rr;
  if(steps!=null && steps>=0 && steps<200000) e.steps=steps;
  history.replaceState(null,"",location.pathname+location.search);
  if(!Object.keys(e).length){ toast("Aucune valeur lisible reçue du Raccourci"); return false; }
  e.at = Date.now();
  S.health.entries[todayKey()] = e;
  if(!S.health.baseline) S.health.baseline = {...e, day:todayKey()};
  else for(const m of METRICS){ if(S.health.baseline[m.k]==null && e[m.k]!=null) S.health.baseline[m.k]=e[m.k]; }
  save();
  toast("Données de ta montre à jour ✓");
  return true;
}

/* ============================================================
   Calculs
   ============================================================ */
function stats(p, now=Date.now()){
  const quit = new Date(p.quitDate).getTime();
  const el = Math.max(0, now-quit);
  const days = el/DAY;
  const ppc = p.perPack>0 ? p.packPrice/p.perPack : 0;
  const cigs = days*p.perDay;
  const money = cigs*ppc;
  const yearly = p.perDay*365*ppc;
  const rewardProg = p.rewardPrice>0 ? Math.min(1, money/p.rewardPrice) : 0;
  const perMs = p.perDay*ppc/DAY;
  const rewardETA = (p.rewardPrice>0 && money<p.rewardPrice && perMs>0) ? (p.rewardPrice-money)/perMs : null;
  return {quit, el, days, cigs, money, yearly, lifeMin:cigs*MIN_PER_CIG, packs:p.perPack>0?cigs/p.perPack:0,
          rewardProg, rewardETA, before: now<quit, lifetime: yearly*p.years};
}
const fmtEUR = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:2});
const fmtEUR0 = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const fmtInt = new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0});
const money = (v,r)=> (r?fmtEUR0:fmtEUR).format(v);
const int = v => fmtInt.format(Math.floor(v));
function dec(v,d){ return v==null?"—":v.toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function dur(ms){
  const s=Math.max(0,Math.floor(ms/1000)), d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(d>=365){ const y=Math.floor(d/365), rd=d%365; return y+" an"+(y>1?"s":"")+(rd?" "+rd+" j":""); }
  if(d>0) return d+" j"+(h?" "+h+" h":"");
  if(h>0) return h+" h "+String(m).padStart(2,"0")+" min";
  return m+" min";
}
function clock(ms){
  const s=Math.floor(ms/1000)%86400;
  return String(Math.floor(s/3600)).padStart(2,"0")+" h  "+String(Math.floor(s%3600/60)).padStart(2,"0")+" min  "+String(s%60).padStart(2,"0")+" s";
}
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============================================================
   Rendu
   ============================================================ */
const $app = document.getElementById("app");
let timer = null;

function render(keepScroll){
  clearInterval(timer); timer=null;
  if(!S.profile){ renderOnboarding(); return; }
  const tab = S.ui.tab;
  let html = '<div class="wrap">';
  if(tab==="today") html += viewToday();
  else if(tab==="body") html += viewBody();
  else if(tab==="health") html += viewHealth();
  else html += viewMe();
  html += '</div>';
  if(tab==="today") html += '<div class="sosdock"><div class="in"><button class="btn ember" data-act="sos">🔥&nbsp; J\'ai envie de fumer</button></div></div>';
  html += tabsBar(tab);
  $app.innerHTML = html;
  if(tab==="today"){ tick(); timer=setInterval(tick,1000); }
  if(tab==="body"){ timer=setInterval(()=>{ if(S.ui.tab==="body" && !document.getElementById("sos")) render(true); },30000); }
  if(!keepScroll) window.scrollTo(0,0);
}

const ICONS = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1.2-3.6 2.5-4.6.2 1.6 1 2.6 2 3.1C11 9 11.5 6 12 3z"/></svg>',
  body:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 17h7"/></svg>',
  health:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="12" height="14" rx="3.5"/><path d="M9 5V2.5h6V5M9 19v2.5h6V19M9 12h1.5l1-2 1.5 4 1-2H15"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
};
function tabsBar(tab){
  const t=[["today","Aujourd'hui"],["body","Ton corps"],["health","Santé"],["me","Toi"]];
  return '<nav class="tabs"><div class="in">'+t.map(([k,l])=>`<button class="tab ${tab===k?"on":""}" data-tab="${k}">${ICONS[k]}<span>${l}</span></button>`).join("")+'</div></nav>';
}

/* ---------- Aujourd'hui ---------- */
function viewToday(){
  const p=S.profile;
  const reasons = p.reasons||[];
  const hasReward = p.rewardPrice>0;
  return `
  <div class="hero" id="hero"></div>
  <div class="grid">
    <div class="card"><div class="eyebrow">Économisé</div><div class="stat num gold" id="t-money"></div><div class="small muted" id="t-yearly"></div></div>
    <div class="card"><div class="eyebrow">Pas fumées</div><div class="stat num" id="t-cigs"></div><div class="small muted" id="t-packs"></div></div>
    <div class="card"><div class="eyebrow">Vie regagnée</div><div class="stat num air" id="t-life"></div><div class="small muted">estimation, ~20 min / cigarette</div></div>
    <div class="card"><div class="eyebrow">Envies vaincues</div><div class="stat num">${resisted()}</div><div class="small muted">${resisted()?"tu les as toutes battues":"chaque SOS tenu compte"}</div></div>
  </div>
  <div class="card" id="t-next"></div>
  ${healthTeaser()}
  ${reasons.length?`<div class="card"><div class="eyebrow">Pourquoi tu fais ça</div><div class="quote" id="t-reason"></div></div>`:""}
  ${hasReward?`<div class="card"><div class="row"><span class="eyebrow gold">Objectif</span><span class="spacer"></span><span class="num gold" id="t-rpct"></span></div>
     <h2 style="margin:10px 0 12px">${esc(p.rewardName||"Ta récompense")}</h2>
     <div class="bar"><i id="t-rbar" style="background:var(--gold);width:0"></i></div>
     <div class="small muted" style="margin-top:10px" id="t-reta"></div></div>`:""}
  `;
}
function ringSVG(prog,color="var(--air)",w=7){

}

function viewHealth(){

    <details class="card"><summary class="eyebrow" style="cursor:pointer">Revoir la mise en place du Raccourci</summary>${shortcutGuide()}</details>`;

function spark(series, ref){
  if(series.length<2) return `<div class="small muted" style="margin:6px 0 10px">La courbe apparaît dès la 2ᵉ journée.</div>`;
  const W=300,H=84,P=6;
  const vals=series.map(x=>x.v).concat(ref!=null?[ref]:[]);
  let mn=Math.min(...vals), mx=Math.max(...vals); if(mx-mn<1e-6){mx+=1;mn-=1;}
  const x=i=>P+(W-2*P)*i/(series.length-1), y=v=>H-P-(H-2*P)*(v-mn)/(mx-mn);
  const pts=series.map((s,i)=>`${x(i).toFixed(1)},${y(s.v).toFixed(1)}`).join(" ");
  const area=`M${x(0)},${H} L`+series.map((s,i)=>`${x(i).toFixed(1)},${y(s.v).toFixed(1)}`).join(" L")+` L${x(series.length-1)},${H} Z`;
  const refLine = ref!=null?`<line x1="0" x2="${W}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--ember)" stroke-width="1" stroke-dasharray="3 3" opacity=".8"/>`:"";
  const last=series.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CF2C4" stop-opacity=".25"/><stop offset="1" stop-color="#7CF2C4" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g)"/>${refLine}
    <polyline points="${pts}" fill="none" stroke="var(--air)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(last)}" cy="${y(series[last].v)}" r="3.5" fill="var(--air)"/></svg>`;
}

  const p=S.profile, s=stats(p), L=["Une envie dure 3 à 5 minutes. Pas plus. Tu es déjà dedans."];
  (p.reasons||[]).forEach(r=>L.push("« "+r+" »"));
  if(!s.before){ L.push(int(s.days)+" jours. Tu ne vas pas les jeter pour 5 minutes."); L.push(money(s.money,true)+" gardés. Une clope ne vaut pas ça."); }
  L.push("Bois un grand verre d'eau froide juste après.");
  L.push("Chaque envie que tu bats rend la suivante plus faible.");
  return L;
}
function sosLoop(t){
  if(!sos) return;
  const el=(t-sos.start)/1000;
  // phase de respiration
  let cyc=0; PHASES.forEach(p=>cyc+=p[1]);
  let x=el%cyc, i=0; while(x>=PHASES[i][1]){ x-=PHASES[i][1]; i++; }
  if(i!==sos.ph){
    sos.ph=i;
    const f=document.getElementById("sos-fill");
    if(f){ f.style.transitionDuration=PHASES[i][1]+"s"; f.style.transform="scale("+PHASES[i][2]+")"; }
    set("sos-ph",PHASES[i][0]); buzz(i===1?12:20);
  }
  set("sos-n", String(Math.max(1,Math.ceil(PHASES[i][1]-x))));
  const rem=Math.max(0,SOS_TOTAL-el);
  set("sos-rem", rem>0? Math.floor(rem/60)+":"+String(Math.floor(rem%60)).padStart(2,"0") : "Terminé");
  const ei=Math.floor(el/12);
  if(ei!==sos.enc){ sos.enc=ei; const L=sosLines(), e=document.getElementById("sos-enc");
    if(e){ e.style.opacity=0; setTimeout(()=>{ e.textContent=L[ei%L.length]; e.style.opacity=1; },250); } }
  if(!sos.done && rem<=0){ sos.done=true; set("sos-ok","L'envie est passée"); buzz([40,60,40]); }
  sos.raf=requestAnimationFrame(sosLoop);
}
function closeSOS(){ if(sos) cancelAnimationFrame(sos.raf); sos=null; const el=document.getElementById("sos"); if(el) el.remove(); render(); }
function sosResult(ok){
  S.cravings.push({at:Date.now(), ok}); save();
  if(sos) cancelAnimationFrame(sos.raf); sos=null;
  const el=document.getElementById("sos"); if(!el) return;
  const n=resisted();
  el.innerHTML=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:0 10px">
    <div style="font-size:64px" class="${ok?"air":"gold"}">${ok?"✓":"↺"}</div>
    <h1>${ok?"Envie battue.":"Ce n'est pas un échec."}</h1>
    <p class="muted">${ok?`Ça fait ${n} envie${n>1?"s":""} vaincue${n>1?"s":""}. Ton cerveau apprend à chaque fois.`
      :"Un faux pas n'efface pas ce que ton corps a déjà réparé. Repère ce qui a déclenché l'envie, et on repart. Si ça se répète, tu peux relancer ta date dans l'onglet Toi."}</p></div>
    ${ok?"":'<a class="btn ghost" href="tel:3989" style="margin-bottom:10px">📞&nbsp; Parler à un tabacologue · 39 89</a>'}
    <button class="btn" data-act="sos-close">Fermer</button>`;
  buzz(ok?[30,50,30]:60);
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* ---------- Toast ---------- */
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

/* ============================================================
   Événements
   ============================================================ */
document.addEventListener("click",e=>{
  const tabBtn=e.target.closest("[data-tab]");
  if(tabBtn){ S.ui.tab=tabBtn.dataset.tab; save(); render(); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="sos") openSOS();
  else if(a==="sos-close") closeSOS();
  else if(a==="sos-ok") sosResult(true);
  else if(a==="sos-slip") sosResult(false);
  else if(a==="ob-next"){ if(ob.step<4){ ob.step++; renderOnboarding(); window.scrollTo(0,0);} else finishOnboarding(); }
  else if(a==="ob-back"){ ob.step=Math.max(0,ob.step-1); renderOnboarding(); }
  else if(a==="ob-now"){ ob.d.now=b.dataset.v==="1"; if(!ob.d.now&&!ob.d.quitDate) ob.d.quitDate=toLocalInput(new Date()); renderOnboarding(); }
  else if(a==="ob-step"){ const f=b.dataset.f; ob.d[f]=clamp(ob.d[f]+ +b.dataset.d, +b.dataset.min, +b.dataset.max); renderOnboarding(); }
  else if(a==="step"){ const f=b.dataset.f; S.profile[f]=clamp(S.profile[f]+ +b.dataset.d, +b.dataset.min, +b.dataset.max); save(); render(); }
  else if(a==="addreason"){ const i=document.getElementById("newreason"); const v=(i&&i.value||"").trim(); if(v){ S.profile.reasons=(S.profile.reasons||[]).concat(v); save(); render(); } }
  else if(a==="delreason"){ S.profile.reasons.splice(+b.dataset.i,1); save(); render(); }
  else if(a==="restart"){ if(confirm("Recommencer maintenant ? Ce que ton corps a réparé ne disparaît pas : on remet juste le compteur à zéro, sans culpabilité.")){ S.profile.quitDate=new Date().toISOString(); save(); S.ui.tab="today"; render(); } }
  else if(a==="erase"){ if(confirm("Effacer toutes tes données Souffle ? C'est définitif.")){ S=blank(); save(); ob.step=0; render(); } }
  else if(a==="export"){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const u=URL.createObjectURL(blob), l=document.createElement("a");
    l.href=u; l.download="souffle-sauvegarde-"+todayKey()+".json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);
  }
});
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.o){
    const k=t.dataset.o;
    if(k==="reason") ob.d.reasons[+t.dataset.i]=t.value;
    else if(k==="packPrice"){ const n=parseNum(t.value); if(n!=null) ob.d.packPrice=n; updateObCost(); }
    else if(k==="rewardPrice"){ ob.d.rewardPrice=parseNum(t.value)||0; const r=document.getElementById("ob-reward"); if(r) r.innerHTML=rewardHint(); }
    else ob.d[k]=t.value;
  }
  if(t.dataset.f && S.profile){
    const k=t.dataset.f;
    if(k==="packPrice"||k==="rewardPrice"){ const n=parseNum(t.value); S.profile[k]= n==null?0:n; }
    else if(k==="quitDate"){ if(t.value) S.profile.quitDate=new Date(t.value).toISOString(); }
    else S.profile[k]=t.value;
    save();
  }
});
function updateObCost(){
  const d=ob.d, ppc=d.perPack>0?d.packPrice/d.perPack:0, y=d.perDay*365*ppc;
  set("ob-yearly", money(y,true)+" par an"); set("ob-life","Soit "+money(y*d.years,true)+" partis en fumée depuis le début.");
}
document.addEventListener("change",e=>{
  if(e.target.id==="importfile" && e.target.files[0]){
    e.target.files[0].text().then(txt=>{
      try{ const d=JSON.parse(txt); if(!d||!("profile" in d)) throw 0; S={...blank(),...d}; save(); toast("Sauvegarde restaurée ✓"); render(); }
      catch(_){ toast("Fichier de sauvegarde illisible"); }
    });
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.id==="newreason"){ e.preventDefault(); document.querySelector('[data-act="addreason"]').click(); } });

window.addEventListener("hashchange",()=>{ if(importFromHash() && S.profile) render(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.profile && S.ui.tab==="today") tick(); });

// Demande à Safari de ne pas effacer les données (si possible)
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

importFromHash();
render();
</script>
